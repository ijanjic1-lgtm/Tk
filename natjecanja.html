        function osvjeziSve(odabranoKolo) {
            const podaci = bazaPodataka[odabranoKolo];
            
            // 1. Popuni Raspored
            const tbodyRaspored = document.getElementById("tablicaRasporeda");
            tbodyRaspored.innerHTML = "";
            if (podaci.raspored.length === 0) {
                tbodyRaspored.innerHTML = "<tr><td colspan='3'>Nema podataka.</td></tr>";
            } else {
                podaci.raspored.forEach(stavka => {
                    tbodyRaspored.innerHTML += `
                        <tr>
                            <td>${stavka.pozicija}.</td>
                            <td><strong>${stavka.igrac}</strong></td>
                            <td>${stavka.red}</td>
                        </tr>`;
                });
            }

            // 2. Popuni Rezultate
            const tbodyRezultati = document.getElementById("tablicaRezultata");
            tbodyRezultati.innerHTML = "";
            if (podaci.rezultati.length === 0) {
                tbodyRezultati.innerHTML = "<tr><td colspan='5'>Nema podataka.</td></tr>";
            } else {
                podaci.rezultati.forEach((mec, index) => {
                    let boja = "#2c3531"; 
                    if(mec.status === "Završeno") boja = "#3b604b";
                    if(mec.status === "Odgođeno") boja = "#e67e22";

                    tbodyRezultati.innerHTML += `
                        <tr>
                            <td>${index + 1}.</td>
                            <td><strong>${mec.igrac1}</strong></td>
                            <td><strong>${mec.igrac2}</strong></td>
                            <td>${mec.rezultat}</td>
                            <td style="color: ${boja}; font-weight: bold;">${mec.status}</td>
                        </tr>`;
                });
            }
			 // 1. POPUNJAVANJE RASPOREDA (Grupno bojanje)
            const tbodyR = document.getElementById("tablicaRasporeda");
            tbodyR.innerHTML = "";
            
            let prosliRed = null;
            let koristiSivu = false;

            podaci.raspored.forEach(s => {
                // Ako se slovo reda promijenilo, promijeni boju pozadine za cijelu tu grupu
                if (prosliRed !== null && s.red !== prosliRed) {
                    koristiSivu = !koristiSivu;
                }
                
                const klasaBoje = koristiSivu ? "red-sivi" : "";
                
                tbodyR.innerHTML += `
                    <tr class="${klasaBoje}">
                        <td>${s.pozicija}.</td>
                        <td><strong>${s.igrac}</strong></td>
                        <td>Red ${s.red}</td>
                    </tr>`;
                
                prosliRed = s.red;
            });
        }
