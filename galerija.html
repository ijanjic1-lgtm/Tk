<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Slatina - Galerija</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-left">
                <div class="menu-dropdown">
                    <button class="menu-btn">☰ Izbornik</button>
                    <div class="dropdown-content">
                        <a href="index.html">Početna</a>
                        <a href="galerija.html">Galerija slika</a>
                        <a href="natjecanja.html">Natjecanja</a>
                    </div>
                </div>
                <a href="index.html" class="logo-area">
                 	 <img src="./Slike/logo.png" alt="TK Slatina Logo" class="logo-img">
                    <span>TK Slatina</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="section">
            <h2>Galerija slika</h2>
            <p style="margin-bottom: 20px;">Pogledajte atmosferu s naših terena i klupskih druženja.</p>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="./Slike/slika1.jpg" alt="Atmosfera 1"></div>
				<div class="gallery-item"><img src="./Slike/slika2.jpg" alt="Atmosfera 1"></div>
				<div class="gallery-item"><img src="./Slike/slika3.jpg" alt="Atmosfera 1"></div>
				<div class="gallery-item"><img src="./Slike/slika4.jpg" alt="Atmosfera 1"></div>
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Teniski klub Slatina. Sva prava pridržana.</p>
    </footer>
	    <!-- SKRIPTA ZA MOBILNI MENU -->
    <script>
        const menuBtn = document.querySelector('.menu-btn');
        const dropdownContent = document.querySelector('.dropdown-content');

        // Otvaranje/Zatvaranje na klik
        menuBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // Zaustavlja zatvaranje odmah nakon klika
            dropdownContent.classList.toggle('prikazi');
        });

        // Zatvori izbornik ako korisnik klikne bilo gdje izvan njega
        document.addEventListener('click', function(e) {
            if (!dropdownContent.contains(e.target) && !menuBtn.contains(e.target)) {
                dropdownContent.classList.remove('prikazi');
            }
        });
    </script>
</body>
</html>
